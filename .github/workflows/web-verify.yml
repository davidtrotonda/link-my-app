name: Web verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Validate generated SEO
        run: npm run seo:check

      - name: Test Cloudflare Worker
        run: npm run test:worker

      - name: Type-check Cloudflare Worker
        run: npm exec -- tsc -p cloudflare-smart-redirect/tsconfig.json

      - name: Verify Cloudflare bundle without publishing
        run: npm exec -- wrangler deploy --dry-run --config cloudflare-smart-redirect/wrangler.jsonc
